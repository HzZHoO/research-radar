name: Update RSI radar

on:
  push:
    branches:
      - main
    paths:
      - 'config.json'
      - 'radars.json'
      - 'scripts/**'
      - 'static/**'
      - 'includes/**'
      - 'tests/**'
      - 'package*.json'
      - 'osmosfeed.yaml'
      - '.github/workflows/update-feed.yaml'
  workflow_dispatch:
  schedule:
    # Lightweight check; only the configured time windows run collection.
    - cron: "*/15 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: research-pages
  cancel-in-progress: false

env:
  RADAR_PROFILE: rsi
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      collect: ${{ steps.due.outputs.collect }}
    steps:
      - uses: actions/checkout@v4
      - id: due
        run: node scripts/check-schedule.mjs
  build:
    needs: check
    if: needs.check.outputs.collect == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Restore article history and blog extraction cache
        uses: actions/cache@v4
        with:
          path: .state
          key: research-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            research-state-
            rsi-state-
      - name: Install dependencies
        run: npm ci
      - name: Check filtering and radar isolation
        run: npm test
      - name: Restore other radar pages
        run: node scripts/published.mjs restore
      - name: Collect selected radar and assemble site
        run: node scripts/build-site.mjs
      - name: Save combined site snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/published.mjs save
      - name: Publish run summary
        if: always()
        run: |
          if [ -f public/rsi/report.md ]; then cat public/report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
