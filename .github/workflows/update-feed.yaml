name: Update research radar

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Lightweight check; only the configured time windows run collection.
    - cron: "*/15 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rsi-pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      collect: ${{ steps.due.outputs.collect }}
    steps:
      - uses: actions/checkout@v4
      - id: due
        run: node scripts/check-schedule.mjs
  build:
    needs: check
    if: needs.check.outputs.collect == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Restore article history and blog extraction cache
        uses: actions/cache@v4
        with:
          path: .state
          key: rsi-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: rsi-state-
      - name: Install dependencies
        run: npm ci
      - name: Check RSI filtering and deduplication
        run: npm test
      - name: Collect and build
        run: npm run build
      - name: Publish run summary
        if: always()
        run: |
          if [ -f public/report.md ]; then cat public/report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
