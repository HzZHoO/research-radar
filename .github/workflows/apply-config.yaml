name: Apply research settings
on:
  workflow_dispatch:
    inputs:
      config_json:
        description: '粘贴设置页面复制的配置 JSON；留空则同步仓库已有配置'
        type: string
        required: false
  push:
    branches: [main]
    paths: [config.json]
permissions:
  contents: write
  actions: write
concurrency:
  group: apply-research-settings
  cancel-in-progress: false
jobs:
  apply:
    if: github.event_name == 'push' || github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/apply-config.mjs
        env:
          RADAR_CONFIG_JSON: ${{ inputs.config_json }}
      - name: Commit settings and update schedule
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config.json
          if ! git diff --cached --quiet; then
            git commit -m 'Apply research radar settings'
            git push origin main
          fi
      - name: Rebuild radar
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh workflow run update-feed.yaml --repo "$REPOSITORY" --ref main
